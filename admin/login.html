<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Partner Portal Login | Shiva Consultancy Group</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/admin.css"/>
<style>
  body { display: flex; min-height: 100vh; align-items: center; justify-content: center; background:
    linear-gradient(135deg, #0A192F 0%, #0d213b 100%); padding: 1.5rem; }
  .panel { width: min(420px, 100%); background: #fff; border-top: 4px solid #a17f3b; padding: 2.25rem 2rem; }
  .brand { font-family: 'Newsreader', serif; font-weight: 700; letter-spacing: .2em; color: #0A192F; font-size: .95rem; }
  .eyebrow { font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: #a17f3b; font-weight: 600; }
  h1 { font-size: 1.5rem; margin: .5rem 0 .25rem; }
  .lede { color: #50606f; margin: 0 0 1.5rem; font-size: .9rem; }
  .form { display: flex; flex-direction: column; gap: 1rem; }
  .form button[type=submit] { margin-top: .5rem; }
  .hint { font-size: .72rem; color: #75777e; text-align: center; margin-top: 1.25rem; }
  .hint a { color: #0A192F; text-decoration: underline; }
</style>
</head>
<body>
<div class="panel">
  <div class="brand">SHIVA CONSULTANCY GROUP</div>
  <div class="eyebrow" style="margin-top:1rem">Partner Portal</div>
  <h1>Sign in</h1>
  <p class="lede">Admins and SCG partners only. Contact your administrator for access.</p>
  <div id="flash"></div>
  <form class="form" id="loginForm">
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required/>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required/>
    </div>
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
  <p class="hint">← <a href="../index.html">Back to mentorshiva.com</a></p>
</div>
<script src="../assets/config.js"></script>
<script type="module">
  import { supabase } from '../assets/supabase.js';
  import { flash } from '../assets/admin.js';

  // Already signed in? bounce to dashboard
  const { data: { session } } = await supabase.auth.getSession();
  if (session) location.replace('./index.html');

  const form = document.getElementById('loginForm');
  const flashHost = document.getElementById('flash');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    flashHost.replaceChildren();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (error) { flash(flashHost, error.message || 'Sign in failed', 'err'); return; }
    const url = new URL(location.href);
    const next = url.searchParams.get('next');
    location.replace(next || './index.html');
  });
</script>
</body>
</html>
