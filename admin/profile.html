<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Account | SCG Partner Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/admin.css"/>
</head>
<body>
<script src="../assets/config.js"></script>
<script type="module">
  import { mountShell, escapeHtml, flash } from '../assets/admin.js';
  import { supabase, currentUser } from '../assets/supabase.js';

  const ctx = await mountShell({ activePath: '/admin/profile.html', title: 'Account', subtitle: 'Your profile and security' });
  if (!ctx) throw new Error('no session');
  const { body, profile } = ctx;
  const user = await currentUser();

  body.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
      <div class="card">
        <h3 style="margin-bottom:.75rem">Profile</h3>
        <div style="display:flex;flex-direction:column;gap:.75rem">
          <div><label>Full name</label><input id="p_name" value="${escapeHtml(profile.full_name || '')}"/></div>
          <div><label>Organization</label><input id="p_org" value="${escapeHtml(profile.organization || '')}"/></div>
          <div><label>Email</label><input value="${escapeHtml(user.email)}" disabled/></div>
          <div><label>Role</label><input value="${escapeHtml(profile.role)}" disabled/></div>
          <button class="btn btn--primary" id="p_save" type="button">Save profile</button>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:.75rem">Change password</h3>
        ${profile.must_change_password ? '<div class="flash flash--warn">You are still using the seeded admin password. Set a strong one now.</div>' : ''}
        <div style="display:flex;flex-direction:column;gap:.75rem">
          <div><label>New password</label><input id="p_pw" type="password" autocomplete="new-password" minlength="10"/></div>
          <div><label>Confirm new password</label><input id="p_pw2" type="password" autocomplete="new-password"/></div>
          <button class="btn btn--primary" id="p_pw_save" type="button">Update password</button>
          <p style="font-size:.72rem;color:#75777e;margin:0">Minimum 10 characters. Use a passphrase.</p>
        </div>
      </div>
    </div>
    ${profile.role === 'admin' ? `
      <div class="card" style="margin-top:1.25rem">
        <h3 style="margin-bottom:.5rem">Invite an SCG Partner</h3>
        <p style="color:#50606f;margin:0 0 .75rem;font-size:.85rem">Admins can create partner accounts that can triage inquiries, manage contacts, and upload documents — but cannot delete shared records.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.5rem;align-items:end">
          <div><label>Full name</label><input id="i_name"/></div>
          <div><label>Email</label><input id="i_email" type="email"/></div>
          <div><label>Temporary password</label><input id="i_pw" type="text" placeholder="Autogenerated if empty"/></div>
          <button class="btn btn--primary" id="i_go" type="button">Send invite</button>
        </div>
        <p style="font-size:.72rem;color:#75777e;margin:.75rem 0 0">Note: Partners must change their password on first login.</p>
      </div>` : ''}
  `;

  document.getElementById('p_save').addEventListener('click', async () => {
    const { error } = await supabase.from('profiles').update({
      full_name: document.getElementById('p_name').value.trim(),
      organization: document.getElementById('p_org').value.trim() || null
    }).eq('id', profile.id);
    flash(body, error ? error.message : 'Profile saved.', error ? 'err' : 'ok');
  });

  document.getElementById('p_pw_save').addEventListener('click', async () => {
    const a = document.getElementById('p_pw').value, b = document.getElementById('p_pw2').value;
    if (a.length < 10) { flash(body, 'Password must be at least 10 characters.', 'err'); return; }
    if (a !== b) { flash(body, 'Passwords do not match.', 'err'); return; }
    const { error } = await supabase.auth.updateUser({ password: a });
    if (error) { flash(body, error.message, 'err'); return; }
    await supabase.from('profiles').update({ must_change_password: false }).eq('id', profile.id);
    flash(body, 'Password updated. You may want to sign in again.', 'ok');
  });

  if (profile.role === 'admin') {
    document.getElementById('i_go').addEventListener('click', async () => {
      const name = document.getElementById('i_name').value.trim();
      const email = document.getElementById('i_email').value.trim();
      let pw = document.getElementById('i_pw').value.trim();
      if (!name || !email) { flash(body, 'Name and email required.', 'err'); return; }
      if (!pw) pw = Math.random().toString(36).slice(2, 10) + '!A1';
      // Use Supabase signUp to create the user (anon/publishable key path).
      // In production, prefer an Edge Function using the service-role key for admin user creation.
      const { data, error } = await supabase.auth.signUp({
        email, password: pw,
        options: { data: { full_name: name, role: 'partner' } }
      });
      if (error) { flash(body, error.message, 'err'); return; }
      flash(body,
        `Invite prepared for ${email}. Temporary password: ${pw}. Share this out-of-band (e.g. WhatsApp). They can change it after first login.`,
        'warn');
    });
  }
</script>
</body>
</html>
